<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-icon-192.png" />
  <link rel="apple-touch-icon"
    href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://jp-master.unipjsk.com" crossorigin />
  <link rel="preconnect" href="https://assets.unipjsk.com" crossorigin />
  <link rel="preconnect" href="https://assets-direct.unipjsk.com" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#34DDFF" />
  <meta name="description" content="Uni PJSK Viewer - Project SEKAI 资源查看器" />
  <title>Uni PJSK Viewer</title>
</head>

<body>
  <div id="app"></div>
  <script>
    (() => {
      const app = document.getElementById('app')
      const recoveryAttemptKey = 'pwa_asset_recovery_attempted'
      let rendered = false
      let switchInProgress = false
      let fallbackDescription
      let fallbackRetry
      const initialController = 'serviceWorker' in navigator
        ? navigator.serviceWorker.controller
        : null

      // When a new SW claims this page, reload immediately so the document and
      // all hashed chunks come from the same deployment. Ignore first install,
      // where there was no previous controller to replace.
      if (initialController) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (navigator.serviceWorker.controller !== initialController) {
            window.location.reload()
          }
        }, { once: true })
      }

      const renderFallback = (message = '应用资源没有成功加载，请检查网络后重新加载。') => {
        if (rendered) {
          if (fallbackDescription) fallbackDescription.textContent = message
          return
        }
        if (!app || app.childElementCount > 0) return
        rendered = true

        const panel = document.createElement('main')
        panel.style.cssText = 'max-width:36rem;margin:12vh auto;padding:2rem;font-family:system-ui,sans-serif;text-align:center;color:#593d48'
        const title = document.createElement('h1')
        title.textContent = '页面暂时无法启动'
        title.style.cssText = 'font-size:1.5rem;margin:0 0 1rem'
        const description = document.createElement('p')
        description.textContent = message
        description.style.cssText = 'line-height:1.7;margin:0 0 1.5rem'
        fallbackDescription = description
        const retry = document.createElement('button')
        retry.type = 'button'
        retry.textContent = '尝试切换并重新加载'
        retry.style.cssText = 'border:0;border-radius:.75rem;padding:.75rem 1.25rem;background:#ff85a1;color:white;font-weight:700;cursor:pointer'
        retry.addEventListener('click', () => void reloadWithLatestWorker())
        fallbackRetry = retry
        panel.append(title, description, retry)
        app.replaceChildren(panel)
      }

      const waitForWorkerState = (worker, targetStates, timeoutMs = 20_000) => {
        const desiredStates = new Set(targetStates)
        if (desiredStates.has(worker.state) || worker.state === 'redundant') {
          return Promise.resolve(desiredStates.has(worker.state))
        }

        return new Promise((resolve) => {
          const finish = (result) => {
            window.clearTimeout(timeout)
            worker.removeEventListener('statechange', handleStateChange)
            resolve(result)
          }
          const handleStateChange = () => {
            if (desiredStates.has(worker.state) || worker.state === 'redundant') {
              finish(desiredStates.has(worker.state))
            }
          }
          const timeout = window.setTimeout(() => finish(false), timeoutMs)
          worker.addEventListener('statechange', handleStateChange)
        })
      }

      const prepareLatestWorker = async () => {
        if (!('serviceWorker' in navigator)) return true

        const registration = await navigator.serviceWorker.getRegistration()
        if (!registration) return true

        let installingWorker = registration.installing
        if (!registration.waiting && !installingWorker) {
          await registration.update()
          installingWorker = registration.installing
        }

        if (installingWorker) {
          const installed = installingWorker.state === 'activated'
            || await waitForWorkerState(installingWorker, ['installed', 'activated'])
          if (!installed) return false
        }

        const waitingWorker = registration.waiting
          || (installingWorker?.state === 'installed' ? installingWorker : undefined)
        if (!waitingWorker) return true

        waitingWorker.postMessage({ type: 'SKIP_WAITING' })
        return waitForWorkerState(waitingWorker, ['activated'])
      }

      const reloadWithLatestWorker = async () => {
        if (switchInProgress) return
        switchInProgress = true

        try {
          sessionStorage.removeItem(recoveryAttemptKey)
        } catch {
          // Ignore unavailable storage.
        }

        if (fallbackRetry) {
          fallbackRetry.disabled = true
          fallbackRetry.textContent = '正在切换版本……'
        }
        renderFallback('正在确认并切换到最新应用版本，请稍候……')

        try {
          if (await prepareLatestWorker()) {
            window.location.reload()
            return
          }
        } catch (error) {
          console.error('PWA: Inline startup recovery failed', error)
        }

        renderFallback('浏览器仍在使用旧版本。请关闭本站所有标签页后重新打开；如果仍未恢复，请彻底退出并重启浏览器。')
        if (fallbackRetry) {
          fallbackRetry.disabled = false
          fallbackRetry.textContent = '再次尝试切换版本'
        }
        switchInProgress = false
      }

      const recoverFromEntryFailure = () => {
        if (!navigator.onLine) {
          renderFallback('当前处于离线状态，并且应用入口尚未缓存。请联网后重新加载。')
          return
        }

        try {
          if (sessionStorage.getItem(recoveryAttemptKey) !== '1') {
            sessionStorage.setItem(recoveryAttemptKey, '1')
            renderFallback('应用资源没有成功加载，正在尝试切换到最新版本……')
            void reloadWithLatestWorker()
            return
          }
        } catch {
          // Storage may be unavailable; show a manual recovery action instead.
        }

        renderFallback('应用资源仍未加载成功。请尝试切换版本；如果仍未恢复，请关闭本站所有标签页或重启浏览器。')
      }

      const timeout = window.setTimeout(renderFallback, 15_000)
      window.__markPwaAppStarted = () => window.clearTimeout(timeout)
      window.addEventListener('error', (event) => {
        const target = event.target
        if (target instanceof HTMLScriptElement && target.type === 'module') {
          recoverFromEntryFailure()
        } else if (target instanceof HTMLLinkElement && ['stylesheet', 'modulepreload'].includes(target.rel)) {
          renderFallback()
        }
      }, true)
    })()
  </script>
  <script type="module">
    import { isQQInAppBrowser, renderUnsupportedBrowserNotice } from '/src/utils/browserSupport'
    import '/src/pwa'
    import { installStartupRecovery } from '/src/utils/startupRecovery'

    installStartupRecovery()

    if (isQQInAppBrowser(navigator.userAgent)) {
      window.__markPwaAppStarted?.()
      renderUnsupportedBrowserNotice()
    } else {
      import('/src/main.ts')
    }
  </script>
</body>

</html>
