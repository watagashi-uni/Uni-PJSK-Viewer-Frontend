<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-icon-192.png" />
  <link rel="apple-touch-icon"
    href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://jp-master.unipjsk.com" crossorigin />
  <link rel="preconnect" href="https://assets.unipjsk.com" crossorigin />
  <link rel="preconnect" href="https://assets-esa.unipjsk.com" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#34DDFF" />
  <meta name="description" content="Uni PJSK Viewer - Project SEKAI 资源查看器" />
  <title>Uni PJSK Viewer</title>
</head>

<body>
  <div id="app"></div>
  <script>
    (() => {
      // Last-resort fallback so a failed start never leaves a blank page. A
      // stale build is replaced by the forced service worker update, which
      // reloads the page by itself; this only shows a manual reload button.
      const app = document.getElementById('app')
      let rendered = false

      const renderFallback = () => {
        if (rendered || !app || app.childElementCount > 0) return
        rendered = true

        const panel = document.createElement('main')
        panel.style.cssText = 'max-width:36rem;margin:12vh auto;padding:2rem;font-family:system-ui,sans-serif;text-align:center;color:#593d48'
        const title = document.createElement('h1')
        title.textContent = '页面暂时无法启动'
        title.style.cssText = 'font-size:1.5rem;margin:0 0 1rem'
        const description = document.createElement('p')
        description.textContent = '应用资源没有成功加载，请检查网络后重新加载。'
        description.style.cssText = 'line-height:1.7;margin:0 0 1.5rem'
        const retry = document.createElement('button')
        retry.type = 'button'
        retry.textContent = '重新加载'
        retry.style.cssText = 'border:0;border-radius:.75rem;padding:.75rem 1.25rem;background:#ff85a1;color:white;font-weight:700;cursor:pointer'
        retry.addEventListener('click', () => window.location.reload())
        panel.append(title, description, retry)
        app.replaceChildren(panel)
      }

      const timeout = window.setTimeout(renderFallback, 15_000)
      window.__markPwaAppStarted = () => window.clearTimeout(timeout)
      window.addEventListener('error', (event) => {
        const target = event.target
        if (
          (target instanceof HTMLScriptElement && target.type === 'module')
          || (target instanceof HTMLLinkElement && ['stylesheet', 'modulepreload'].includes(target.rel))
        ) {
          renderFallback()
        }
      }, true)
    })()
  </script>
  <script type="module">
    import { isQQInAppBrowser, renderUnsupportedBrowserNotice } from '/src/utils/browserSupport'
    import '/src/pwa'
    import { installStartupRecovery } from '/src/utils/startupRecovery'

    installStartupRecovery()

    if (isQQInAppBrowser(navigator.userAgent)) {
      window.__markPwaAppStarted?.()
      renderUnsupportedBrowserNotice()
    } else {
      import('/src/main.ts')
    }
  </script>
</body>

</html>
